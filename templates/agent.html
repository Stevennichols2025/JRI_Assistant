<!DOCTYPE html>
<html>
<head>
    <title>Simple Chatbot</title>
    <style>
        .chat-container {
            width: 500px;
            margin: 0 auto;
            padding: 20px;
        }
        .chat-history {
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin: 5px 0;
            padding: 5px;
        }
        .user-message {
            background-color: #e3f2fd;
            text-align: right;
        }
        .bot-message {
            background-color: #f5f5f5;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex-grow: 1;
            padding: 5px;
        }
        .model-dropdown {
            padding: 5px;
            margin-bottom: 10px;
            width: 100%;
            margin-right: 10px;
        }
        .input-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
    </style>
</head>
<body>
     <h1>Agent.py</h1>
     <p>This is a simple chatbot that uses the OpenAI API to generate responses. It is built with Flask and uses the OpenAI Python library to interact with the API.</p>
    <div class="chat-container">
        <div class="chat-history" id="chat-history"></div>
        <div class="input-container">
            <select id="model" class="model-dropdown">
                <option value="gpt-3.5-turbo">Open AI 3.5 Turbo</option>
                <option value="gpt-4o">Open AI 4o</option>
                <option value="gpt-4o-mini">Open AI 4o-Mini</option>
                <option value="o1-mini">Open AI o1 Mini</option>
                <option value="deepseek-r1-distill-qwen-7b">Deepseek R1 Distill Qwen 7B</option>
                <option value="qwen2.5-7b-instruct-1m">Qwen 2.5 7B 1M Instruct</option>
                

            </select>
            <input type="text" id="user-input" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function addMessage(message, isUser) {
            const chatHistory = document.getElementById('chat-history');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
            messageDiv.textContent = message;
            chatHistory.appendChild(messageDiv);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            const selectedModel = model.value;
            
            if (message) {
                addMessage(message, true);
                input.value = '';

                fetch('/send_message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        message: message,
                        model: selectedModel
                    })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.error) {
                        addMessage('Error: ' + data.error, false);
                    } else {
                        addMessage(data.response, false);
                    }
                })
                .catch(error => {
                    addMessage('Error: ' + error, false);
                });
            }
        }

        // Allow sending message with Enter key
        document.getElementById('user-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
